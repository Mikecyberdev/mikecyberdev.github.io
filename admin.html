<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Admin | Mike Cyber Dev</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" sizes="64x64" href="./src/assets/images/favicon.png">
  <link rel="stylesheet" href="./src/output.css" />
</head>

<body class="h-screen overflow-hidden bg-[#050816] text-white">
  <div class="relative h-screen overflow-hidden">
    <div class="absolute inset-0 bg-black/35"></div>
    <div class="absolute inset-0 bg-gradient-to-br from-[#050816] via-[#08152d]/90 to-[#0b1b36]/80"></div>

    <main class="relative z-10 h-screen overflow-hidden px-4 py-4 sm:px-6 sm:py-6 lg:px-8">
      <div class="mx-auto flex h-full max-w-7xl flex-col gap-4">
        <div id="admin-status" class="admin-status hidden px-4 py-3 text-sm"></div>

        <section id="login-panel" class="mx-auto my-auto w-full max-w-2xl">
          <div class="admin-card rounded-3xl p-6 sm:p-8">
            <div class="mb-8">
              <p class="font-heading text-xs uppercase tracking-[0.35em] text-cyan-400">
                Secure Access
              </p>
              <h2 class="mt-3 text-2xl font-semibold">Sign in to edit your site</h2>
              <p class="admin-mini-note mt-3">
                Use the same email and password you enabled in Supabase Authentication. After login, this page will
                load your current portfolio content and file uploads.
              </p>
            </div>

            <form id="login-form" class="space-y-5">
              <div>
                <label for="login-email" class="admin-label">Email address</label>
                <input id="login-email" name="email" type="email" autocomplete="email" class="admin-input"
                  placeholder="Enter Valid Email Address" required />
              </div>

              <div>
                <label for="login-password" class="admin-label">Password</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password"
                  class="admin-input" placeholder="Enter your password" required />
              </div>

              <div class="flex flex-wrap items-center gap-3 pt-2">
                <button id="login-submit-btn" type="submit" class="admin-btn-primary">
                  <i class="fa-solid fa-lock-open"></i>
                  Sign In
                </button>
                <button id="login-signout-btn" type="button" class="admin-btn-secondary hidden">
                  <i class="fa-solid fa-right-from-bracket"></i>
                  Sign Out
                </button>
              </div>
            </form>
          </div>
        </section>

        <section id="dashboard-panel" class="hidden min-h-0 flex-1">
          <div class="admin-dashboard-shell">
            <aside class="admin-sidebar-shell" aria-label="Editor navigation">
              <div class="admin-sidebar-brand">
                <img src="./src/assets/images/logo-nav.png" alt="Mike Cyber Dev Logo" class="admin-sidebar-logo" />
              </div>

              <nav class="admin-sidebar-nav" aria-label="Dashboard sections">
                <button type="button" class="admin-side-link is-active" data-admin-nav-link="profile-panel"
                  aria-controls="profile-panel">
                  <span class="admin-side-link-icon">
                    <i class="fa-solid fa-user-pen"></i>
                  </span>
                  <span class="admin-side-link-label">Profile</span>
                </button>

                <button type="button" class="admin-side-link" data-admin-nav-link="files-panel"
                  aria-controls="files-panel">
                  <span class="admin-side-link-icon">
                    <i class="fa-solid fa-folder-open"></i>
                  </span>
                  <span class="admin-side-link-label">Files</span>
                </button>

                <button type="button" class="admin-side-link" data-admin-nav-link="skills-panel"
                  aria-controls="skills-panel">
                  <span class="admin-side-link-icon">
                    <i class="fa-solid fa-bolt"></i>
                  </span>
                  <span class="admin-side-link-label">Skills</span>
                </button>

                <button type="button" class="admin-side-link" data-admin-nav-link="projects-panel"
                  aria-controls="projects-panel">
                  <span class="admin-side-link-icon">
                    <i class="fa-solid fa-diagram-project"></i>
                  </span>
                  <span class="admin-side-link-label">Projects</span>
                </button>
              </nav>

              <button id="sign-out-btn" type="button" class="admin-btn-secondary admin-sidebar-signout hidden">
                <i class="fa-solid fa-right-from-bracket"></i>
                Sign Out
              </button>
            </aside>

            <section class="admin-main-shell" aria-label="Editor workspace">
              <header class="admin-main-toolbar">
                <div class="admin-main-heading">
                  <p class="font-heading text-[0.7rem] uppercase tracking-[0.34em] text-cyan-400">Content Editor</p>
                  <h2 id="admin-active-section-title" class="mt-2 text-2xl font-semibold text-white sm:text-3xl">
                    Profile
                  </h2>
                </div>

                <button id="save-content-btn" type="button" class="admin-btn-primary hidden">
                  <i class="fa-solid fa-floppy-disk"></i>
                  Save Changes
                </button>
              </header>

              <div class="admin-main-content">
                <article id="profile-panel" data-admin-panel
                  class="admin-card admin-section-card admin-editor-panel rounded-[1.9rem] p-6 sm:p-8">
                  <div class="grid gap-5 md:grid-cols-2">
                    <div>
                      <label for="profile-full-name" class="admin-label">Full name</label>
                      <input id="profile-full-name" class="admin-input" placeholder="Your full name" />
                    </div>

                    <div>
                      <label for="profile-role-line" class="admin-label">Role line</label>
                      <input id="profile-role-line" class="admin-input"
                        placeholder="Frontend Developer • Fullstack in Training • Cybersecurity Student" />
                    </div>

                    <div class="md:col-span-2">
                      <label for="profile-about-heading" class="admin-label">About heading</label>
                      <input id="profile-about-heading" class="admin-input"
                        placeholder="Building clean interfaces with a security-conscious mindset." />
                    </div>

                    <div class="md:col-span-2">
                      <label for="profile-about-intro" class="admin-label">About paragraph 1</label>
                      <textarea id="profile-about-intro" class="admin-textarea"
                        placeholder="Short intro paragraph"></textarea>
                    </div>

                    <div class="md:col-span-2">
                      <label for="profile-about-body" class="admin-label">About paragraph 2</label>
                      <textarea id="profile-about-body" class="admin-textarea"
                        placeholder="Middle paragraph"></textarea>
                    </div>

                    <div class="md:col-span-2">
                      <label for="profile-about-goal" class="admin-label">About paragraph 3</label>
                      <textarea id="profile-about-goal" class="admin-textarea"
                        placeholder="Closing paragraph"></textarea>
                    </div>

                    <div class="md:col-span-2">
                      <label for="profile-about-tags" class="admin-label">About tags</label>
                      <input id="profile-about-tags" class="admin-input"
                        placeholder="Frontend Development, Fullstack Learning, Cybersecurity" />
                    </div>
                  </div>
                </article>

                <article id="files-panel" data-admin-panel
                  class="admin-card admin-section-card admin-editor-panel hidden rounded-[1.9rem] p-6 sm:p-8">
                  <div class="grid gap-6 xl:grid-cols-[minmax(0,1.1fr),minmax(300px,0.9fr)]">
                    <div class="space-y-6">
                      <div>
                        <label for="profile-image-url" class="admin-label">Profile image URL</label>
                        <input id="profile-image-url" class="admin-input" placeholder="https://..." />
                      </div>

                      <div>
                        <label for="profile-image-alt" class="admin-label">Profile image alt text</label>
                        <input id="profile-image-alt" class="admin-input" placeholder="Profile image alt text" />
                      </div>

                      <div>
                        <label for="cv-url" class="admin-label">CV file URL</label>
                        <input id="cv-url" class="admin-input" placeholder="https://..." />
                      </div>
                    </div>

                    <div class="space-y-6">
                      <div class="admin-preview rounded-2xl p-4">
                        <label for="profile-image-file" class="admin-label">Upload profile image</label>
                        <input id="profile-image-file" type="file" accept="image/*"
                          class="block text-sm text-slate-300 file:mr-4 file:rounded-full file:border-0 file:bg-cyan-400/15 file:px-4 file:py-2 file:text-sm file:font-semibold file:text-cyan-300 hover:file:bg-cyan-400/25" />
                        <div class="mt-4 overflow-hidden rounded-2xl">
                          <img id="profile-image-preview" src="./src/assets/images/profile.jpg" alt="Profile preview"
                            class="h-56 w-full rounded-2xl object-cover" />
                        </div>
                      </div>

                      <div class="admin-preview rounded-2xl p-4">
                        <label for="cv-file" class="admin-label">Upload CV</label>
                        <input id="cv-file" type="file" accept=".pdf"
                          class="block text-sm text-slate-300 file:mr-4 file:rounded-full file:border-0 file:bg-cyan-400/15 file:px-4 file:py-2 file:text-sm file:font-semibold file:text-cyan-300 hover:file:bg-cyan-400/25" />
                        <a id="cv-link-preview" href="./public/files/Ndukwe_Michael_Okorie_Junior_CV.pdf"
                          target="_blank" rel="noopener noreferrer" class="admin-btn-secondary mt-4 inline-flex">
                          <i class="fa-solid fa-file-arrow-down"></i>
                          Preview current CV
                        </a>
                      </div>
                    </div>
                  </div>
                </article>

                <article id="skills-panel" data-admin-panel
                  class="admin-card admin-section-card admin-editor-panel hidden rounded-[1.9rem] p-6 sm:p-8">
                  <div class="flex justify-end">
                    <button id="add-skill-group-btn" type="button" class="admin-btn-secondary">
                      <i class="fa-solid fa-plus"></i>
                      Add Skill Category
                    </button>
                  </div>

                  <div id="skills-admin-list" class="mt-6 space-y-5"></div>
                </article>

                <article id="projects-panel" data-admin-panel
                  class="admin-card admin-section-card admin-editor-panel hidden rounded-[1.9rem] p-6 sm:p-8">
                  <div class="flex justify-end">
                    <button id="add-project-btn" type="button" class="admin-btn-secondary">
                      <i class="fa-solid fa-plus"></i>
                      Add Project
                    </button>
                  </div>

                  <div id="projects-admin-list" class="mt-6 space-y-5"></div>
                </article>

                <button id="save-content-btn-bottom" type="button" class="hidden" aria-hidden="true" tabindex="-1">
                  Save Changes
                </button>
              </div>
            </section>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="./src/js/admin.js"></script>
</body>

</html>
